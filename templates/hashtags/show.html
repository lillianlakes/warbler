{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <h4>#{{ hashtag.name }}</h4>
    <ul class="list-group mt-3">
      {% for msg in messages %}
        <li class="list-group-item">
          <a href="/users/{{ msg.user.id }}">@{{ msg.user.username }}</a>
          <span class="text-muted">{{ msg.timestamp.strftime('%d %B %Y') }}</span>
          <p class="mb-0"><a href="/messages/{{ msg.id }}">{{ msg.text }}</a></p>
        </li>
      {% else %}
        <li class="list-group-item text-muted">No posts found for this hashtag.</li>
      {% endfor %}
    </ul>
  </div>
</div>
{% endblock %}
