{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h4>Reply to @{{ parent_message.user.username }}</h4>
    <p class="text-muted">{{ parent_message.text }}</p>
    <form method="POST">
      {{ form.csrf_token }}
      {{ form.text(placeholder='Write your reply...', class='form-control', rows='3') }}
      <button class="btn btn-outline-primary btn-block mt-3">Post reply</button>
    </form>
  </div>
</div>
{% endblock %}
